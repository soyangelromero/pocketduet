<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PocketDuet — Nintendo DS + Game Boy Advance in the browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a38"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#3a5bd9"/>
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36e0b0"/>
      <stop offset="1" stop-color="#1b8f9a"/>
    </linearGradient>
    <linearGradient id="melon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b8b"/>
      <stop offset="1" stop-color="#d92e55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <g opacity="0.35">
    <circle cx="1080" cy="-40" r="240" fill="#3a5bd9"/>
    <circle cx="120" cy="420" r="260" fill="#7a2b7a"/>
    <circle cx="980" cy="420" r="180" fill="#1b8f9a"/>
  </g>

  <!-- handheld -->
  <g transform="translate(92 44)">
    <rect x="0" y="0" width="330" height="272" rx="34" fill="#0a1226" stroke="#2f4a8f" stroke-width="2"/>
    <rect x="22" y="20" width="286" height="128" rx="10" fill="#050914" stroke="#34519a"/>
    <rect x="34" y="32" width="262" height="104" rx="6" fill="url(#screenA)"/>
    <path d="M40 122 L104 74 L156 100 L214 56 L288 112 L288 132 L40 132 Z" fill="#0c1530" opacity="0.45"/>
    <rect x="22" y="158" width="286" height="94" rx="10" fill="#050914" stroke="#34519a"/>
    <rect x="34" y="170" width="262" height="70" rx="6" fill="url(#screenB)"/>
    <circle cx="160" cy="205" r="22" fill="#0c1530" opacity="0.5"/>
    <rect x="290" y="22" width="4" height="228" rx="2" fill="#7aa2ff" opacity="0.35"/>
  </g>

  <!-- melon slice -->
  <g transform="translate(440 96) rotate(-12)" filter="url(#glow)">
    <path d="M0 80 A80 80 0 0 1 160 80 Z" fill="url(#melon)"/>
    <path d="M0 80 A80 80 0 0 1 160 80 Z" fill="none" stroke="#8de7a8" stroke-width="9"/>
    <g fill="#ffe6ec">
      <circle cx="58" cy="66" r="4"/><circle cx="84" cy="54" r="4"/><circle cx="110" cy="64" r="4"/>
      <circle cx="72" cy="82" r="4"/><circle cx="98" cy="82" r="4"/><circle cx="126" cy="80" r="4"/>
    </g>
  </g>

  <g font-family="Segoe UI, Inter, system-ui, sans-serif">
    <text x="640" y="150" fill="#f2f5ff" font-size="64" font-weight="800" letter-spacing="-1.5">PocketDuet</text>
    <text x="642" y="194" fill="#9fb3e6" font-size="25" font-weight="500">Nintendo DS + Game Boy Advance, right in your browser.</text>
    <g font-size="16" font-weight="700">
      <g transform="translate(642 232)">
        <rect x="0" y="0" width="128" height="34" rx="17" fill="#172448" stroke="#34519a"/>
        <text x="64" y="22" fill="#cfe0ff" text-anchor="middle">WebAssembly</text>
      </g>
      <g transform="translate(784 232)">
        <rect x="0" y="0" width="118" height="34" rx="17" fill="#172448" stroke="#34519a"/>
        <text x="59" y="22" fill="#cfe0ff" text-anchor="middle">GPL-3.0</text>
      </g>
      <g transform="translate(916 232)">
        <rect x="0" y="0" width="158" height="34" rx="17" fill="#172448" stroke="#34519a"/>
        <text x="79" y="22" fill="#cfe0ff" text-anchor="middle">DS + GBA</text>
      </g>
      <g transform="translate(642 278)">
        <text x="0" y="22" fill="#6fe3b0">●</text>
        <text x="22" y="22" fill="#8ea6dc" font-weight="500">Bring your own ROMs · Runs locally · No game files included</text>
      </g>
    </g>
  </g>
</svg>
