<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PocketDuet — Nintendo DS y Game Boy Advance en el navegador">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#101a36"/>
      <stop offset="1" stop-color="#24143a"/>
    </linearGradient>
    <linearGradient id="duoA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55a0ff"/>
      <stop offset="1" stop-color="#3f4ed1"/>
    </linearGradient>
    <linearGradient id="duoB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3de2b0"/>
      <stop offset="1" stop-color="#158d92"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb3"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <g opacity="0.34">
    <circle cx="1100" cy="-60" r="250" fill="#3f4ed1"/>
    <circle cx="90" cy="430" r="270" fill="#6d2a7a"/>
    <circle cx="1030" cy="430" r="190" fill="#158d92"/>
  </g>

  <!-- two screens, two systems -->
  <g transform="translate(84 46)">
    <g filter="url(#glow)" opacity="0.65">
      <circle cx="202" cy="132" r="112" fill="none" stroke="url(#ring)" stroke-width="3"/>
    </g>
    <rect x="40" y="0" width="246" height="104" rx="14" fill="#060b18" stroke="#3a56a8" stroke-width="2"/>
    <rect x="52" y="12" width="222" height="80" rx="8" fill="url(#duoA)"/>
    <path d="M58 80 L112 38 L158 64 L206 30 L266 72 L266 86 L58 86 Z" fill="#0b1530" opacity="0.42"/>
    <rect x="86" y="128" width="246" height="118" rx="14" fill="#060b18" stroke="#2f9b93" stroke-width="2"/>
    <rect x="98" y="140" width="222" height="94" rx="8" fill="url(#duoB)"/>
    <circle cx="209" cy="187" r="27" fill="#07111f" opacity="0.55"/>
    <rect x="98" y="248" width="222" height="4" rx="2" fill="#3de2b0" opacity="0.4"/>
    <rect x="40" y="112" width="246" height="2" rx="1" fill="#3a56a8" opacity="0.4"/>
    <circle cx="302" cy="28" r="4" fill="#55a0ff"/>
    <circle cx="302" cy="42" r="4" fill="#3de2b0"/>
    <circle cx="302" cy="56" r="4" fill="#ff8fb3"/>
  </g>

  <g font-family="Segoe UI, Inter, system-ui, sans-serif">
    <text x="560" y="142" fill="#f2f5ff" font-size="68" font-weight="800" letter-spacing="-1.8">PocketDuet</text>
    <text x="562" y="186" fill="#a9b9e8" font-size="24" font-weight="500">Nintendo DS + GBA, en tu navegador.</text>
    <g font-size="16" font-weight="700">
      <g transform="translate(562 222)">
        <rect x="0" y="0" width="132" height="34" rx="17" fill="#172448" stroke="#3a56a8"/>
        <text x="66" y="22" fill="#cfe0ff" text-anchor="middle">WebAssembly</text>
      </g>
      <g transform="translate(706 222)">
        <rect x="0" y="0" width="112" height="34" rx="17" fill="#172448" stroke="#3a56a8"/>
        <text x="56" y="22" fill="#cfe0ff" text-anchor="middle">GPL-3.0</text>
      </g>
      <g transform="translate(830 222)">
        <rect x="0" y="0" width="168" height="34" rx="17" fill="#172448" stroke="#2f9b93"/>
        <text x="84" y="22" fill="#cfe0ff" text-anchor="middle">DS + GBA</text>
      </g>
      <g transform="translate(562 274)">
        <text x="0" y="22" fill="#6fe3b0">●</text>
        <text x="22" y="22" fill="#8ea6dc" font-weight="500">Tus ROMs. Tu biblioteca. Cero instalaciones.</text>
      </g>
    </g>
  </g>
</svg>
